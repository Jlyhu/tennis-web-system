spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8080

# JWT (sesión del comprador). En producción define la variable de entorno JWT_SECRET (mínimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-en-produccion-minimo-32-caracteres}
app.jwt.expiracion-minutos=480