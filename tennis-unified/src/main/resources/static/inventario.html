<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar producto — Fsteni58</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="announcement-bar"></div>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo-group">
        <span class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="9" stroke="#FFF" stroke-width="1.6"/>
            <path d="M4 8c3 1.6 11 1.6 14 0M4 14c3-1.6 11-1.6 14 0" stroke="#FFF" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="brand-name">Fsteni58</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Inicio</a>
      </nav>
    </div>
  </header>

  <div class="pagina">
    <main>
      <div class="tarjeta">
        <h2>Nuevo producto</h2>
        <form id="formProducto">
          <div class="campo">
            <label for="proveedorId">Id del proveedor</label>
            <input type="text" id="proveedorId" placeholder="El id que te dio el registro" required>
          </div>

          <div class="campo">
            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" required>
          </div>

          <div class="campo">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="2"></textarea>
          </div>

          <div class="campo">
            <label for="categoria">Categoría</label>
            <input type="text" id="categoria" placeholder="Equipamiento deportivo, accesorios...">
          </div>

          <div class="campo">
            <label for="precio">Precio (COP)</label>
            <input type="number" id="precio" min="0" step="1" required>
          </div>

          <div class="campo">
            <label for="stock">Stock</label>
            <input type="number" id="stock" min="0" step="1" required>
          </div>

          <button type="submit" class="boton-principal">Registrar producto</button>
        </form>
        <div id="mensaje" class="mensaje"></div>
      </div>
      <p class="pie"><a href="actualizar-stock.html">Actualizar el stock de un producto existente</a></p>
    </main>
  </div>

  <script>
    document.getElementById('formProducto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'mensaje';

      const cuerpo = {
        proveedorId: document.getElementById('proveedorId').value,
        nombre: document.getElementById('nombre').value,
        descripcion: document.getElementById('descripcion').value,
        categoria: document.getElementById('categoria').value,
        precio: parseFloat(document.getElementById('precio').value),
        stock: parseInt(document.getElementById('stock').value, 10)
      };

      try {
        const respuesta = await fetch('/productos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cuerpo)
        });
        const datos = await respuesta.json();

        if (respuesta.ok) {
          mensaje.className = 'mensaje exito';
          mensaje.textContent = 'Producto registrado. Id: ' + datos.id;
        } else {
          mensaje.className = 'mensaje error';
          mensaje.textContent = datos.error || 'No se pudo registrar el producto.';
        }
      } catch (err) {
        mensaje.className = 'mensaje error';
        mensaje.textContent = 'No se pudo conectar con el servidor.';
      }
    });
  </script>
</body>
</html>
