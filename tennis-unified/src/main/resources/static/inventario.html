<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar producto — Fsteni58</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <div class="announcement-bar"></div>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo-group">
        <span class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="9" stroke="#FFF" stroke-width="1.6"/>
            <path d="M4 8c3 1.6 11 1.6 14 0M4 14c3-1.6 11-1.6 14 0" stroke="#FFF" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="brand-name">Fsteni58</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Inicio</a>
      </nav>
      <div class="nav-actions">
        <a href="login.html" id="btn-login" class="login-btn">Iniciar Sesión</a>
      </div>
    </div>
  </header>

  <div class="pagina">
    <main>
      <div class="tarjeta">
        <h2>Nuevo producto <span class="rol">— Proveedor</span></h2>
        <form id="formProducto">
          <div class="campo">
            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" required>
          </div>

          <div class="campo">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="2"></textarea>
          </div>

          <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" required>
              <option value="">Elige una categoría</option>
              <option value="raquetas">Raquetas Premium</option>
              <option value="calzado">Zapatillas &amp; Calzado</option>
              <option value="accesorios">Accesorios &amp; Pelotas</option>
            </select>
          </div>

          <div class="campo">
            <label for="precio">Precio (COP)</label>
            <input type="number" id="precio" min="0" step="1" required>
          </div>

          <div class="campo">
            <label for="stock">Stock</label>
            <input type="number" id="stock" min="0" step="1" required>
          </div>

          <button type="submit" class="boton-principal">Registrar producto</button>
        </form>
        <div id="mensaje" class="mensaje"></div>
      </div>
      <p class="pie"><a href="actualizar-stock.html">Actualizar el stock de un producto existente</a></p>
    </main>
  </div>

  <script src="js/sesion.js"></script>
  <script src="js/inventario.js"></script>
</body>
</html>
