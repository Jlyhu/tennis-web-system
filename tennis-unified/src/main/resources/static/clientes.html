<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionar clientes — Fsteni58</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="encabezado">
    <a href="index.html#area-admin" class="marca"><span>Fsteni58</span></a>
    <span class="etiqueta-admin">PANEL ADMIN</span>
  </div>
  <main class="ancho">
    <div class="tarjeta ancha">
      <h2>Clientes registrados</h2>
      <table>
        <thead>
          <tr><th>Nombre</th><th>Correo</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody id="tablaClientes"></tbody>
      </table>
      <div id="mensaje" class="mensaje"></div>
    </div>
  </main>

  <script>
    async function cargarClientes() {
      const tabla = document.getElementById('tablaClientes');
      tabla.innerHTML = '';
      try {
        const respuesta = await fetch('/admin/clientes');
        const clientes = await respuesta.json();
        clientes.forEach(c => {
          const fila = document.createElement('tr');
          if (!c.activo) fila.className = 'inactivo';
          fila.innerHTML = `
            <td>${c.nombre}</td>
            <td>${c.correo}</td>
            <td>${c.activo ? 'Activo' : 'Desactivado'}</td>
            <td>${c.activo ? `<button class="chico" onclick="desactivar('${c.id}')">Desactivar</button>` : ''}</td>
          `;
          tabla.appendChild(fila);
        });
      } catch (err) {
        document.getElementById('mensaje').className = 'mensaje error';
        document.getElementById('mensaje').textContent = 'No se pudo conectar con el servidor.';
      }
    }

    async function desactivar(id) {
      await fetch('/admin/clientes/' + id, { method: 'DELETE' });
      cargarClientes();
    }

    cargarClientes();
  </script>
</body>
</html>
