<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar stock — Fsteni58</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="announcement-bar"></div>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo-group">
        <span class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="9" stroke="#FFF" stroke-width="1.6"/>
            <path d="M4 8c3 1.6 11 1.6 14 0M4 14c3-1.6 11-1.6 14 0" stroke="#FFF" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="brand-name">Fsteni58</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Inicio</a>
      </nav>
    </div>
  </header>

  <div class="pagina">
    <main>
      <div class="tarjeta">
        <h2>Actualizar stock</h2>
        <form id="formStock">
          <div class="campo">
            <label for="productoId">Id del producto</label>
            <input type="text" id="productoId" placeholder="El id que te dio el registro" required>
          </div>
          <div class="campo">
            <label for="stockNuevo">Stock nuevo</label>
            <input type="number" id="stockNuevo" min="0" step="1" required>
          </div>
          <button type="submit" class="boton-principal">Actualizar</button>
        </form>
        <div id="mensaje" class="mensaje"></div>
      </div>
      <p class="pie"><a href="inventario.html">Registrar un producto nuevo</a></p>
    </main>
  </div>

  <script src="js/actualizar-stock.js"></script>
</body>
</html>
