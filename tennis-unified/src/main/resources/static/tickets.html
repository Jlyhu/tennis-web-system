<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte — Fsteni58</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="announcement-bar"></div>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo-group">
        <span class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="9" stroke="#FFF" stroke-width="1.6"/>
            <path d="M4 8c3 1.6 11 1.6 14 0M4 14c3-1.6 11-1.6 14 0" stroke="#FFF" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="brand-name">Fsteni58</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Inicio</a>
      </nav>
    </div>
  </header>

  <div class="pagina">
    <main>
      <div class="tarjeta">
        <h2>Reportar un problema <span class="rol">— Comprador</span></h2>
        <form id="formTicket">
          <div class="campo">
            <label for="compradorId">Tu id de comprador</label>
            <input type="text" id="compradorId" placeholder="El id que te dio tu registro" required>
          </div>
          <div class="campo">
            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" required>
          </div>
          <div class="campo">
            <label for="descripcion">Cuéntanos qué pasó</label>
            <textarea id="descripcion" rows="3" required></textarea>
          </div>
          <button type="submit" class="boton-principal">Enviar</button>
        </form>
        <div id="mensaje" class="mensaje"></div>
      </div>

      <div class="lista-tickets">
        <h2 style="font-family:'Oswald',sans-serif;font-size:1.1rem;">Mis reportes</h2>
        <div id="listaTickets"></div>
      </div>
    </main>
  </div>

  <script src="js/tickets.js"></script>
</body>
</html>
