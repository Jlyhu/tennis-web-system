<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte — Fsteni58</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="encabezado">
    <a href="index.html" class="marca"><span>Fsteni58</span></a>
    <nav class="enlaces-topbar"><a href="index.html">Inicio</a></nav>
  </div>
  <main>
    <div class="tarjeta">
      <h2>Reportar un problema <span style="font-size:0.7rem;font-weight:600;color:var(--texto-suave);">— Comprador</span></h2>
      <form id="formTicket">
        <div class="campo">
          <label for="compradorId">Tu id de comprador</label>
          <input type="text" id="compradorId" placeholder="el id que te dio tu registro" required>
        </div>
        <div class="campo">
          <label for="asunto">Asunto</label>
          <input type="text" id="asunto" required>
        </div>
        <div class="campo">
          <label for="descripcion">Cuéntanos qué pasó</label>
          <textarea id="descripcion" rows="3" required></textarea>
        </div>
        <button type="submit" class="boton-principal">Enviar</button>
      </form>
      <div id="mensaje" class="mensaje"></div>
    </div>

    <div class="lista-tickets">
      <h2 style="font-family:'Oswald',sans-serif;font-size:1.1rem;">Mis reportes</h2>
      <div id="listaTickets"></div>
    </div>
  </main>

  <script src="js/tickets.js"></script>
</body>
</html>
