<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Fsteni58</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <main class="pagina">
    <div class="tarjeta">

      <div class="marca">Fsteni58</div>

      <h1>Inicia sesión</h1>
      <p class="subtitulo">Entra con tu correo y contraseña para seguir comprando o gestionando tu inventario.</p>

      <form id="form-login" novalidate>

        <label class="campo">
          <span class="etiqueta">Correo electrónico</span>
          <input type="email" id="correo" name="correo" autocomplete="email" inputmode="email" placeholder="correo@ejemplo.com" required maxlength="150">
          <span class="error" id="error-correo"></span>
        </label>

        <label class="campo">
          <span class="etiqueta">Contraseña</span>
          <div class="campo-password">
            <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" placeholder="Tu contraseña" required minlength="8">
            <button type="button" class="ver-password" id="ver-password" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
          <span class="error" id="error-contrasena"></span>
        </label>

        <div class="aviso" id="aviso" role="alert" hidden></div>

        <button type="submit" class="boton-principal" id="boton-enviar">
          <span id="boton-texto">Entrar</span>
        </button>

      </form>

      <p class="pie">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
      <p class="pie"><a href="index.html">&larr; Volver al inicio</a></p>

    </div>
  </main>

  <script>
    (function () {
      var boton = document.getElementById('ver-password');
      var campo = document.getElementById('contrasena');
      if (!boton || !campo) return;
      boton.addEventListener('click', function () {
        var mostrando = campo.type === 'text';
        campo.type = mostrando ? 'password' : 'text';
        boton.classList.toggle('activo', !mostrando);
        boton.setAttribute('aria-pressed', String(!mostrando));
        boton.setAttribute('aria-label', mostrando ? 'Mostrar contraseña' : 'Ocultar contraseña');
      });
    })();
  </script>
  <script src="js/sesion.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
