<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrarse — Fsteni58</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="court-band">
    <h1><a href="index.html">Fsteni58</a></h1>
    <p>Comprador US1 / Proveedor — registro</p>
  </div>
  <main>
    <div class="card">
      <h2>Crear una cuenta</h2>
      <form id="formRegistro">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" required>

        <label for="correo">Correo</label>
        <input type="email" id="correo" required>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required minlength="6">

        <label for="rol">Tipo de cuenta</label>
        <select id="rol">
          <option value="comprador">Comprador</option>
          <option value="proveedor">Proveedor mayorista</option>
        </select>

        <button type="submit">Registrarme</button>
      </form>
      <div id="mensaje" class="mensaje"></div>
    </div>
    <nav class="enlaces"><a href="login.html">Ya tengo cuenta, iniciar sesión</a></nav>
  </main>

  <script>
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'mensaje';

      const cuerpo = {
        nombre: document.getElementById('nombre').value,
        correo: document.getElementById('correo').value,
        contrasena: document.getElementById('contrasena').value,
        rol: document.getElementById('rol').value
      };

      try {
        const respuesta = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cuerpo)
        });
        const datos = await respuesta.json();

        if (respuesta.ok) {
          mensaje.className = 'mensaje exito';
          mensaje.textContent = 'Cuenta creada. Tu id es: ' + datos.id;
        } else {
          mensaje.className = 'mensaje error';
          mensaje.textContent = datos.error || 'No se pudo registrar.';
        }
      } catch (err) {
        mensaje.className = 'mensaje error';
        mensaje.textContent = 'No se pudo conectar con el servidor.';
      }
    });
  </script>
</body>
</html>
