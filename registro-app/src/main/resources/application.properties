# ============================================
# Conexion a Supabase (PostgreSQL)
# Reemplaza <TU-PROYECTO> por el host real que te da Supabase en:
# Project Settings > Database > Connection string (modo "Session pooler" o directo)
# ============================================
spring.datasource.url=jdbc:postgresql://db.<TU-PROYECTO>.supabase.co:5432/postgres
spring.datasource.username=postgres
# NUNCA pongas la contraseña real aqui en un repo publico.
# Se recomienda usar una variable de entorno: ver README.md
spring.datasource.password=${SUPABASE_DB_PASSWORD:coloca_tu_password_aqui}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema ya existe (creado con el script SQL), asi que Hibernate NO debe
# crear ni modificar tablas automaticamente.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# Necesario porque las columnas "activo" no tienen valor por defecto forzado
# desde la app en el insert generado (la tabla ya trae default true).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
